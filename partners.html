<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>제휴·추천 업체 | 랜덤코리아</title><meta name="robots" content="noindex"><style>body{margin:0;background:#f8f4ed}</style></head><body>
<div id="rk-partner-preview">
<style>
#rk-partner-preview{font-family:'Noto Sans KR',sans-serif;background:#f8f4ed;color:#38291e;border-radius:12px;overflow:hidden;font-size:14px}#rk-partner-preview a{color:inherit;text-decoration:none}#rk-partner-preview button:focus-visible,#rk-partner-preview a:focus-visible{outline:3px solid #8b643d;outline-offset:3px}#rk-partner-preview *{box-sizing:border-box}#rk-partner-preview header{display:flex;align-items:center;gap:28px;flex-wrap:wrap;padding:22px 30px;border-bottom:1px solid #ded2c3;background:#fbf8f1;padding-right:110px}#rk-partner-preview .logo{font-family:serif;font-size:26px;font-weight:700}#rk-partner-preview nav{display:flex;gap:20px;font-size:13px}#rk-partner-preview nav span:last-child{color:#8b643d;font-weight:700}#rk-partner-preview main{padding:30px;max-width:1100px;margin:auto}#rk-partner-preview .eyebrow{letter-spacing:3px;color:#8b643d;font-size:11px}#rk-partner-preview h1{font-family:serif;font-size:32px;margin:12px 0}#rk-partner-preview .subtitle{color:#776755;line-height:1.8}#rk-partner-preview .filters{background:#fffcf7;border:1px solid #e5dacb;border-radius:14px;padding:20px;margin:24px 0}#rk-partner-preview .regions{display:flex;gap:8px;flex-wrap:wrap}#rk-partner-preview button{font:inherit;cursor:pointer;border:1px solid #dacbb8;background:#fffcf7;color:#614b36;border-radius:8px;padding:10px 15px}#rk-partner-preview button.active{background:#8b643d;color:#fff;border-color:#8b643d}#rk-partner-preview .search-row{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}#rk-partner-preview input,#rk-partner-preview select{font:inherit;padding:11px;border:1px solid #dacbb8;border-radius:8px;color:#38291e;background:#fffdf9}#rk-partner-preview input{flex:1;min-width:160px}#rk-partner-preview .result{display:flex;justify-content:space-between;gap:12px;margin:20px 0;color:#776755}#rk-partner-preview .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}#rk-partner-preview article{background:#fffcf7;border:1px solid #e5dacb;border-radius:13px;overflow:hidden}#rk-partner-preview .photo{height:140px;display:grid;place-content:center;text-align:center;background:#e9dfd0;color:#70583f;gap:10px}#rk-partner-preview .photo i{margin:auto;width:34px;height:34px}#rk-partner-preview .photo small{font-size:11px;letter-spacing:2px}#rk-partner-preview .info{padding:17px}#rk-partner-preview .meta{font-size:12px;color:#82715f}#rk-partner-preview h2{font-size:18px;margin:10px 0}#rk-partner-preview .desc{color:#776755;font-size:13px;line-height:1.6;min-height:42px}#rk-partner-preview .benefit{background:#f1e8db;color:#765432;padding:10px;border-radius:7px;font-size:12px;margin:13px 0}#rk-partner-preview .detail{width:100%;background:#8b643d;color:#fff;border:0}#rk-partner-preview .pages{display:flex;justify-content:center;gap:8px;margin:26px 0}#rk-partner-preview .footer{border-top:1px solid #e5dacb;padding:18px;text-align:center;color:#82715f;font-size:12px}#rk-partner-preview .dialog{background:#fffdf9;border:1px solid #dacbb8;border-radius:12px;padding:22px;margin-top:18px}#rk-partner-preview .empty{padding:40px;text-align:center;grid-column:1/-1} @media(max-width:700px){#rk-partner-preview .grid{grid-template-columns:repeat(2,minmax(0,1fr))}#rk-partner-preview main{padding:18px}#rk-partner-preview header{padding:18px}#rk-partner-preview nav{gap:12px}}@media(max-width:440px){#rk-partner-preview .grid{grid-template-columns:1fr}#rk-partner-preview .result{flex-wrap:wrap}#rk-partner-preview h1{font-size:27px}}
</style>
<header><div class="logo">랜덤코리아</div><nav aria-label="주요 메뉴"><a href="./index.html">랜덤 여행</a><a href="./index.html#travel">홈으로</a><span>제휴·추천 업체</span></nav></header>
<main><div class="eyebrow">RANDOM KOREA PARTNERS</div><h1>여행의 좋은 순간을 함께할 곳</h1><p class="subtitle">지역별 제휴·추천 업체를 만나보세요.<br>랜덤코리아 회원을 위한 혜택도 함께 확인할 수 있어요.</p>
<section class="filters" aria-label="업체 검색"><div class="regions"></div><div class="search-row"><select aria-label="세부 지역"></select><input aria-label="업체 검색" placeholder="업체명 또는 지역 검색"><select class="category" aria-label="업종"><option>전체 업종</option><option>숙소</option><option>맛집·카페</option><option>체험·액티비티</option></select></div></section>
<div class="result"><span class="count" aria-live="polite"></span><span>가상 업체·혜택으로 구성한 화면 예시</span></div><div class="grid"></div><div class="pages"></div><section class="dialog" hidden aria-live="polite"></section>
</main><div class="footer">LUMEA · RANDOM KOREA　|　<a href="http://pf.kakao.com/_xmXsFX" target="_blank" rel="noopener noreferrer">제휴·광고 문의</a></div>
<script>
(()=>{const root=document.getElementById('rk-partner-preview');const regions=['전체','서울','경기','인천','강원','충청','전라','경상','제주'];const towns={서울:['마포구','강남구','종로구'],경기:['가평군','수원시','성남시'],인천:['연수구','강화군'],강원:['강릉시','속초시'],충청:['공주시','제천시'],전라:['전주시','여수시'],경상:['경주시','부산'],제주:['제주시','서귀포시']};const types=['맛집·카페','숙소','체험·액티비티'];const titles=['온유 커피','느린하루 스테이','마을 공방','골목 식탁','숲길 펜션','여행 사진관'];const items=Array.from({length:100},(_,i)=>{const region=regions[1+i%8],town=towns[region][Math.floor(i/8)%towns[region].length],type=types[Math.floor(i/8)%3];return{region,town,type,name:titles[Math.floor(i/8)%6]+' '+town+'점',id:i+1};});let region='서울',page=1;const grid=root.querySelector('.grid'),sub=root.querySelector('select'),search=root.querySelector('input'),cat=root.querySelector('.category'),detail=root.querySelector('.dialog');
function draw(){let list=items.filter(x=>(region==='전체'||x.region===region)&&(sub.value==='전체 지역'||x.town===sub.value)&&(cat.value==='전체 업종'||x.type===cat.value)&&(!search.value||[x.name,x.region,x.town].join(' ').includes(search.value)));const pages=Math.max(1,Math.ceil(list.length/20));page=Math.min(page,pages);root.querySelector('.count').textContent=region+' 업체 '+list.length+'곳 · 전체 등록 100곳';grid.innerHTML=list.slice((page-1)*20,page*20).map(x=>`<article><div class="photo"><span aria-hidden="true">${x.type==='숙소'?'🏡':x.type==='맛집·카페'?'☕':'🎨'}</span><small>업체 사진 영역</small></div><div class="info"><div class="meta">${x.region} · ${x.town}　|　${x.type} · 제휴</div><h2>${x.name}</h2><div class="desc">${x.type==='숙소'?'편안한 휴식으로 채우는 하루':x.type==='맛집·카페'?'여행 중 잠시 쉬어가기 좋은 공간':'여행에 특별한 추억을 더하는 경험'}</div><div class="benefit">회원 혜택 · ${x.type==='숙소'?'예약 시 웰컴 서비스':x.type==='맛집·카페'?'음료 10% 할인':'체험 예약 5% 할인'} (예시)</div><button class="detail cursor-interaction" data-id="${x.id}">상세보기 →</button></div></article>`).join('')||'<div class="empty">조건에 맞는 업체가 없습니다.</div>';root.querySelector('.pages').innerHTML=Array.from({length:pages},(_,i)=>`<button class="cursor-interaction ${page===i+1?'active':''}" data-page="${i+1}" aria-label="${i+1}페이지">${i+1}</button>`).join('');}
function choose(){root.querySelector('.regions').innerHTML=regions.map(r=>`<button class="cursor-interaction ${r===region?'active':''}" aria-pressed="${r===region}" data-region="${r}">${r}</button>`).join('');sub.innerHTML=['전체 지역',...(region==='전체'?[]:towns[region])].map(r=>`<option>${r}</option>`).join('');page=1;detail.hidden=true;draw();}root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.region){region=b.dataset.region;choose();}if(b.dataset.page){page=Number(b.dataset.page);draw();}if(b.dataset.id){const x=items.find(x=>x.id===Number(b.dataset.id));detail.innerHTML=`<h2>${x.name}</h2><p>${x.region} ${x.town} · ${x.type}</p><p>업체 소개, 주소, 영업시간, 회원 혜택과 이용 조건이 이곳에 표시됩니다.</p><p>예약·문의 버튼은 실제 업체 등록 후 연결됩니다.</p><button class="cursor-interaction" data-close="true">닫기</button>`;detail.hidden=false;detail.scrollIntoView({block:'nearest'});}if(b.dataset.close)detail.hidden=true;});[sub,cat].forEach(x=>x.addEventListener('change',()=>{page=1;draw();}));search.addEventListener('input',()=>{page=1;draw();});choose();})();
</script></div>

</body></html>
